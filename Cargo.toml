[package]
name = "blobvault"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
directories = "6"
zeroize = "1"
anyhow = "1"

[profile.release]
strip = true
lto = true
